server {
    listen 3000;
    server_name _;

    underscores_in_headers on;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # DNS Resolver for external proxy requests
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Asaas API Proxy - Sandbox
    location /api/asaas-sandbox/ {
        proxy_pass https://sandbox.asaas.com/v3/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host sandbox.asaas.com;
        proxy_set_header access_token $http_access_token;
        proxy_pass_request_headers on;
    }

    # Asaas API Proxy - Production
    location /api/asaas-prod/ {
        proxy_pass https://api.asaas.com/v3/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host api.asaas.com;
        proxy_set_header access_token $http_access_token;
        proxy_pass_request_headers on;
    }

    # SMTP Direct Email & Verification Proxy to Node.js backend service
    location /api/send-email {
        proxy_pass http://127.0.0.1:3001/api/send-email;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25M;
    }

    location /api/test-smtp {
        proxy_pass http://127.0.0.1:3001/api/test-smtp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 5M;
    }

    # Prevent browser caching of index.html so updates are loaded immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
