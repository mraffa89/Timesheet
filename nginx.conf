server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Asaas API Proxy - Sandbox
    location /api/asaas-sandbox/ {
        proxy_pass https://sandbox.asaas.com/v3/;
        proxy_ssl_server_name on;
        proxy_set_header Host sandbox.asaas.com;
        proxy_set_header access_token $http_access_token;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
    }

    # Asaas API Proxy - Production
    location /api/asaas-prod/ {
        proxy_pass https://api.asaas.com/v3/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.asaas.com;
        proxy_set_header access_token $http_access_token;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
